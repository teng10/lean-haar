
name: Build project and documentation

on:
  push:
    branches: [main]
    # Publish only when a build or documentation input changes; PR safety checks are separate.
    paths:
      - '**/*.lean'
      - 'lean-toolchain'
      - 'lakefile.toml'
      - 'lake-manifest.json'
      - 'references.bib'
      - 'blueprint/**'
      - 'home_page/**'
      - '.github/workflows/blueprint_new.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  pages: write

jobs:
  build:
    # ubuntu-latest moved to Ubuntu 26.04 in early November 2026. doc-gen4 v4.30.0 fails there
    # with "resource exhausted (error code: 12)" (leanprover/doc-gen4#434); leanprover/cslib pins
    # the same image. The fix ships with Lean v4.37: return to ubuntu-latest after that bump.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout project
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          # This might remove tools that are actually needed,
          # if set to "true" but frees about 6 GB
          tool-cache: false

          # All of these are set to true by default and free a lot of space
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          # API documentation is memory-intensive; retain the runner's swap.
          swap-storage: false

      - name: Build Lean project
        uses: leanprover/lean-action@v1
        with:
          build: true
          lint: false
          mk_all-check: false

      # lean-action saves its cache before docgen is compiled. Keep these tool artifacts
      # separately; docgen-action already caches the generated documentation data.
      - name: Cache documentation generator
        if: github.event_name == 'push'
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            .lake/packages/doc-gen4/.lake/build
            .lake/packages/leansqlite/.lake/build
            .lake/packages/Cli/.lake/build
            .lake/packages/UnicodeBasic/.lake/build
            .lake/packages/BibtexQuery/.lake/build
            .lake/packages/MD4Lean/.lake/build
          key: docgen-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.*', '.github/workflows/blueprint_new.yml') }}

      - name: Build homepage, API docs, and blueprint
        # Includes regeneration of project HTML after a documentation-cache hit.
        uses: leanprover-community/docgen-action@dacc1acc2a3f532cc577266979ba9c36c7593f7c
        with:
          blueprint: true
          homepage: home_page
          api-docs: true
