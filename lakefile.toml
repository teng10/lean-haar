name = "LeanHaar"
defaultTargets = ["LeanHaar"]
testDriver = "LeanHaarTest"

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false
# Fail on warnings in this package; dependency warnings remain advisory.
warningAsError = true
# Mathlib's linter: `native_decide` is not allowed (it trusts the compiler; CI also audits every declaration's axioms)
weak.linter.style.nativeDecide = true

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"


[[require]]
name = "checkdecls"
git = "https://github.com/PatrickMassot/checkdecls.git"
[[lean_lib]]
name = "LeanHaar"
globs = ["LeanHaar.*"]

# `lake test`: #print axioms guards for the existing main results
[[lean_lib]]
name = "LeanHaarTest"
srcDir = "test"
globs = ["LeanHaarTest.*"]

[[require]]
name = "Physlib"
scope = "leanprover-community"
git = "https://github.com/leanprover-community/physlib.git"
